name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: tests
      run: cargo test --locked --all

    - name: Install mdBook 0.5.4
      run: |
        mkdir -p "$RUNNER_TEMP/mdbook"
        curl --fail --location --retry 3 \
          https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
          --output "$RUNNER_TEMP/mdbook.tar.gz"
        echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook" mdbook
        echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

    - name: mdBook build smoke test
      run: cargo test --locked --test it -- --ignored

  check_fmt_and_docs:
    name: Checking fmt and docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        components: rustfmt, clippy

    - name: fmt
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --locked --all

    - name: Docs
      run: cargo doc --locked --no-deps
