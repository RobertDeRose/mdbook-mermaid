name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: Release tag to validate; empty means the triggering commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Verify release version
      if: inputs.tag != ''
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        python3 - <<'PY'
        import os
        import re
        import tomllib
        from pathlib import Path

        tag = os.environ["RELEASE_TAG"]
        if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
            raise SystemExit("Expected a stable vMAJOR.MINOR.PATCH release tag")
        version = tag[1:]
        manifest = tomllib.loads(Path("Cargo.toml").read_text())
        lock = tomllib.loads(Path("Cargo.lock").read_text())
        package = next(p for p in lock["package"] if p["name"] == "mdbook-mermaid")
        if manifest["package"]["version"] != version or package["version"] != version:
            raise SystemExit("Release tag, Cargo.toml, and Cargo.lock versions must match")
        PY

    - name: Release tooling tests
      run: python3 -m unittest discover -s scripts -p 'test_*.py'

    - name: tests
      run: cargo test --locked --all

    - name: Install mdBook 0.5.4
      run: |
        mkdir -p "$RUNNER_TEMP/mdbook"
        curl --fail --location --retry 3 \
          https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
          --output "$RUNNER_TEMP/mdbook.tar.gz"
        echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook" mdbook
        echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

    - name: mdBook build smoke test
      run: cargo test --locked --test it -- --ignored

  check_fmt_and_docs:
    name: Checking fmt and docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        components: rustfmt, clippy

    - name: Set up workflow linting
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        install: false
        cache: false

    - name: Validate workflows
      run: mise exec --locked actionlint@1.7.12 shellcheck@0.11.0 -- actionlint

    - name: fmt
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --locked --all

    - name: Docs
      run: cargo doc --locked --no-deps
