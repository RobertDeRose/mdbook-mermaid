name: Release mdbook-mermaid

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdbook-mermaid-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  release:
    name: Bump fork version
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          install: false

      - name: Install release tooling
        run: mise install --locked cocogitto@7.0.0

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Bump and push version
        id: release
        shell: bash
        run: |
          # Do not release a stale commit if main advanced while tests ran.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main has advanced; the newer workflow run will release it"
            exit 0
          fi
          git switch -C main "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git config tag.gpgsign false
          before=$(git rev-parse HEAD)
          mise exec --locked cocogitto@7.0.0 -- cog check --from-latest-tag
          mise exec --locked cocogitto@7.0.0 -- cog bump --auto
          if [[ "$(git rev-parse HEAD)" == "$before" ]]; then
            echo "No releasable changes"
            exit 0
          fi
          tag=$(git describe --tags --exact-match HEAD)
          # Validate the version-bumped package before publishing the commit/tag.
          cargo test --locked --all
          git diff --exit-code
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish binaries
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
