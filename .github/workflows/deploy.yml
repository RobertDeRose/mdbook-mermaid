# Based on https://github.com/starship/starship/blob/master/.github/workflows/deploy.yml

name: Build and Release Binaries
on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v1.2.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mdbook-mermaid-binaries-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CRATE_NAME: mdbook-mermaid
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    uses: ./.github/workflows/tests.yml
    with:
      tag: ${{ inputs.tag }}

  # Always build the tagged commit, not the release workflow's original SHA.
  github_build:
    name: Build release binaries
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: aarch64-unknown-linux-musl.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Setup | Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: ${{ matrix.target }}

      - name: Apt Setup on act
        if: ${{ env.ACT }}
        run: sudo apt update

      - name: Setup | musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt install -y musl-tools

      - name: Setup | musl cross-compile
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pushd /tmp
          wget https://github.com/musl-cross/musl-cross/releases/download/20241103/aarch64-unknown-linux-musl.tar.xz
          tar -xf aarch64-unknown-linux-musl.tar.xz
          echo "d3c597e89f4b87f78d473f1f6a539ed817afbce9b73a02dd123c6d5c4e43f617 *aarch64-unknown-linux-musl.tar.xz" | sha256sum -c -
          ccpath=$(realpath "$(find . -name aarch64-unknown-linux-musl-cc -print -quit)")
          popd
          mkdir -p .cargo
          echo "[target.aarch64-unknown-linux-musl]" > .cargo/config.toml
          printf 'linker = "%s"\n' "$ccpath" >> .cargo/config.toml

      - name: Build | Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Post Setup | Prepare artifacts [Windows]
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p target/stage
          cp LICENSE README.md CHANGELOG.md target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          strip "$CRATE_NAME.exe"
          7z a "../../stage/$CRATE_NAME-$RELEASE_TAG-${{ matrix.name }}" "$CRATE_NAME.exe" LICENSE README.md CHANGELOG.md
          cd -

      - name: Post Setup | Prepare artifacts [-nix]
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p target/stage
          cp LICENSE README.md CHANGELOG.md target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.target }}" != "aarch64-unknown-linux-musl" ]; then
            strip "$CRATE_NAME"
          fi
          tar czvf "../../stage/$CRATE_NAME-$RELEASE_TAG-${{ matrix.name }}" "$CRATE_NAME" LICENSE README.md CHANGELOG.md
          cd -

      - name: Post Setup | Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.CRATE_NAME }}-${{ inputs.tag }}-${{ matrix.name }}
          path: target/stage/*

  # Create a GitHub release with built archives only.
  # This workflow does not publish the crate to crates.io.
  github_release:
    name: Create GitHub Release
    needs: github_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Setup | Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mdbook-mermaid-*
          merge-multiple: true
          path: artifacts

      - name: Setup | Release notes and checksums
        run: |
          awk '/^- - -$/{exit} {print}' CHANGELOG.md > RELEASE.md
          (cd artifacts && sha256sum mdbook-mermaid-* > SHA256SUMS)

      - name: Release | Create GitHub release and upload assets
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file RELEASE.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
